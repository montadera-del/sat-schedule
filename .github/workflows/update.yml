name: Update matches
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-matches
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python sport_channels.py
        env:
          PYTHONIOENCODING: utf-8
      - run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add out/matches.json out/unmatched.txt cache
          git commit -m "update matches" || exit 0
          git pull --rebase -X ours
          git push
